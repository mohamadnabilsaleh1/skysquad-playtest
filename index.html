<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1a2e">
  <title>Sky Squad</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1a2e; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
    #unity-fullscreen-container {
      position: relative;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      width: min(100dvw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100dvw * 16 / 9));
      background: #16405a;
    }
    body.mobile #unity-fullscreen-container { width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #16405a; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #unity-loading-container {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: linear-gradient(180deg, #102a44, #16405a); color: #b9c3cc;
    }
    #unity-progress-bar-empty { width: 60%; max-width: 320px; height: 10px; background: rgba(0,0,0,0.35); border-radius: 999px; overflow: hidden; }
    #unity-progress-bar-full { height: 100%; width: 0; background: #ff8a3d; transition: width 0.2s; }
    #unity-loading-text { font-size: 14px; padding: 0 16px; text-align: center; }
    #unity-warning { position: absolute; left: 10px; right: 10px; top: 10px; display: none; font-size: 13px; }
    #unity-warning div { border-radius: 8px; margin-bottom: 6px; color: #111; }
  </style>
</head>
<body>
  <div id="unity-fullscreen-container">
    <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
    <div id="unity-loading-container">
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      <div id="unity-loading-text">Loading&hellip;</div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile) document.body.classList.add("mobile");
    const canvas = document.querySelector("#unity-canvas");
    const loadingContainer = document.querySelector("#unity-loading-container");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const loadingText = document.querySelector("#unity-loading-text");

    function unityShowBanner(msg, type) {
      const warningBanner = document.querySelector("#unity-warning");
      const div = document.createElement("div");
      div.textContent = msg;
      warningBanner.appendChild(div);
      warningBanner.style.display = "block";
      if (type === "error") div.style.cssText = "background:#ffb4ad;padding:10px;";
      else {
        div.style.cssText = type === "warning" ? "background:#ffe08a;padding:10px;" : "background:#cde;padding:10px;";
        setTimeout(() => { warningBanner.removeChild(div); if (!warningBanner.children.length) warningBanner.style.display = "none"; }, 5000);
      }
    }

    function failLoad(msg) {
      progressBarFull.style.width = "0";
      loadingText.textContent = msg;
      loadingText.style.color = "#ffb4ad";
    }

    let wasmOk = false;
    try {
      wasmOk = typeof WebAssembly === "object" &&
        WebAssembly.validate(new Uint8Array([0,0x61,0x73,0x6d,1,0,0,0]));
    } catch (e) { wasmOk = false; }
    const inflateOk = typeof DecompressionStream === "function";

    // The two big files are stored gzipped. The Unity loader asks for the plain names through
    // fetch(); this shim serves the .gz and inflates it in the browser, passing through untouched
    // if the host already decoded it on the wire.
    (function () {
      const map = {
        "WebGL.data": { gz: "Build/WebGL.data.gz.wasm", size: 12416024, type: "application/octet-stream" },
        "WebGL.wasm": { gz: "Build/WebGL.wasm.gz.wasm", size: 29873013, type: "application/wasm" },
      };
      const realFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        const url = typeof input === "string" ? input : (input && input.url) || "";
        const key = Object.keys(map).find((k) => url.endsWith(k));
        if (!key) return realFetch(input, init);
        const m = map[key];
        const target = new URL(m.gz, document.baseURI).href;
        return realFetch(target, init).then(async (res) => {
          if (!res.ok || !res.body) return res;
          const reader = res.body.getReader();
          const first = await reader.read();
          const headers = { "Content-Type": m.type, "Content-Length": String(m.size) };
          if (first.done) return new Response(new Uint8Array(0), { status: 200, headers });
          const head = first.value;
          const isGzip = head.length >= 2 && head[0] === 0x1f && head[1] === 0x8b;
          const rest = new ReadableStream({
            start(c) { c.enqueue(head); },
            async pull(c) { const r = await reader.read(); if (r.done) c.close(); else c.enqueue(r.value); },
            cancel() { return reader.cancel(); },
          });
          const body = isGzip ? rest.pipeThrough(new DecompressionStream("gzip")) : rest;
          return new Response(body, { status: 200, statusText: "OK", headers });
        });
      };
    })();

    if (!wasmOk) {
      failLoad("This browser cannot run the game.");
    } else if (!inflateOk) {
      failLoad("Please update your browser to play.");
    } else {
      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "mtjrcloud",
        productName: "Sky Squad",
        productVersion: "playtest",
        showBanner: unityShowBanner,
      };
      if (isMobile) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      const script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onerror = () => failLoad("The game files did not load. Refresh to try again.");
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
          loadingText.textContent = progress < 1 ? "Loading… " + Math.round(progress * 100) + "%" : "Starting…";
        }).then(() => {
          loadingContainer.style.display = "none";
        }).catch((message) => failLoad("The game could not start: " + message));
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
